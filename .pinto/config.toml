columns = [
    "todo",
    "in-progress",
    "review",
    "done",
]
done_column = "done"

[project]
name = "scull7.com"
key = "T"

# Personal TUI keybindings belong in $XDG_CONFIG_HOME/pinto/config.toml.
# Pinto 0.4.3 rejects [tui.key_bindings] in this shared board config.
[tui]
confirm_quit = true

[storage]
backend = "file"

[wip]
enabled = true

[display]
markdown = true
timezone = "local"

[points]
aggregate_children = false
