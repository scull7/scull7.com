[build]
  command = "bash scripts/netlify-build.sh"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  ELM_HOME = "/opt/buildhome/.elm"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/resume.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/openapi.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/mcp"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET,POST,OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "/interview/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET,POST,OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[redirects]]
  from = "/openapi.json"
  to = "/.netlify/functions/interview/openapi.json"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/interview/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/interview"
  to = "/.netlify/functions/interview/interview"
  status = 200
  force = true

[[redirects]]
  from = "/interview/*"
  to = "/.netlify/functions/interview/interview/:splat"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
  node_bundler = "none"
  included_files = [
    "public/resume.json",
    "public/*.md",
    "public/llms.txt",
    "public/llms-full.txt",
    "netlify/functions/_corpus/**"
  ]

[[edge_functions]]
  function = "negotiate"
  path = "/*"
